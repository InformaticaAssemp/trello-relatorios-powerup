<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Conector Power-Up Relatórios TI</title>
  <script src="https://p.trellocdn.com/power-up.min.js"></script>
</head>
<body>
  <script>
    var ICON_SVG = 'data:image/svg+xml;utf8,' + encodeURIComponent(
      '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
      '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>' +
      '<polyline points="14 2 14 8 20 8"/>' +
      '<line x1="16" y1="13" x2="8" y2="13"/>' +
      '<line x1="16" y1="17" x2="8" y2="17"/>' +
      '<polyline points="10 9 9 9 8 9"/>' +
      '</svg>'
    );

    window.TrelloPowerUp.initialize({
      'board-buttons': function (t, opts) {
        return [{
          icon: {
            dark: ICON_SVG,
            light: ICON_SVG
          },
          text: '📊 Relatórios TI',
          callback: function (t) {
            return t.modal({
              title: '📊 Extrator de Relatórios — TI Manutenção',
              url: t.signUrl('./modal.html'),
              fullscreen: true
            });
          }
        }];
      }
    });
  </script>
</body>
</html>
